name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Licence gate (runtime dependencies)
        run: uv run scripts/check_licenses.py
      - name: "Tests (synthetic slide, dummy backbone: no weights, no data)"
        run: uv run pytest -q
      - name: Pipeline definition is valid
        run: uv run dvc stage list
