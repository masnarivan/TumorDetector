# M4, lymph node: metastasis yes / no for a whole slide (docs/training-multicentro.md).
# Validated by tumordetector/heads/spec.py. A change to sites, datasets, labels, domain or roles changes
# the cohort: bump `version` and rewrite the cohort file on purpose (`td task=cohort head.overwrite=true`).
id: ln_metastasis
version: 1
module: M4
task: binary
sites: [C77.3]                     # ICD-O-3 topography of the manifest rows this head covers
datasets: [camelyon16, camelyon17]
labels:                            # reference_diagnosis -> label; anything else is excluded, with the reason
  negative: 0
  micro: 1
  macro: 1
  # itc left out: isolated tumour cells are below a tile's resolution (experiment C17, section 1)
domain: [dataset, center]          # what counts as one domain for balancing and group DRO
roles:                             # manifest column -> values; every other slide is development
  external: {center: [lpon]}       # locked external test: read only by `td task=external`
recipe: []                         # mitigations, heads/mitigations.py: balanced, group_dro, stat_mix (E7)
calibration:
  method: temperature              # one global temperature, from out-of-fold logits
  inner_folds: 3                   # leave-one-centre-out: folds of the training centres for its temperature
gate:                              # initial proposals, to be agreed with the pathologists
  min_slides: 100                  # below this a run only checks that the code works
  min_cv_auroc: 0.90
  min_loco_worst_auroc: 0.85
  max_ece: 0.10                    # calibrated, cross-validation
  max_loco_ece: 0.10               # calibrated, worst held-out centre
  min_loco_specificity: 0.80       # worst held-out centre
  max_center_probe_auroc: 0.80     # negatives only; first step, to tighten after E7
  min_robustness_index: 0.5        # first step, to tighten after E7
overwrite: false                   # task=cohort only: the cohort file is never rewritten implicitly
