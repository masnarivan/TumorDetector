defaults:
  - backbone: phikon
  - data: camelyon16
  - head: ln_metastasis
  - _self_

task: ???            # manifest | tile | embed | index | stream | splits | cohort | train
seed: 0

paths:
  out: ${data.out}   # pipeline outputs (DVC-tracked), relative to the repo root: one folder per dataset
  heads: data/manifests/heads   # cohort files of the heads (task=cohort), versioned in git

tiling:              # must match the backbone's native input (checked at embed time)
  tile_px: 224
  target_mpp: 0.5    # ~20x
  min_tissue: 0.5
  mask_downsample: 64
  mask_margin: 0.03

qc:                  # a slide below these thresholds is referred, never silently dropped
  min_tiles: 50
  min_tissue_mm2: 1.0

embed:
  batch_size: 64
  threads: 4
  dtype: float16
  device: auto       # auto | cuda | mps | cpu

vectordb:            # Qdrant; the API key comes from the environment (TD_QDRANT_API_KEY in .env), never from here
  url: ${oc.env:TD_QDRANT_URL,http://localhost:6333}
  rebuild: false     # drop and reload the backbone's collection
  batch: 256         # points per upload request

index:               # what of each slide goes into the database (vectordb/reduce.py)
  region_tiles: 8    # regions of 8 x 8 tiles (~0.9 mm at 0.5 mpp), mean embedding
  min_region_tiles: 16
  prototypes: 256    # k-center tiles per slide: in E3 as good an OOD reference as all the tiles

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: embedding-extraction

mil:                 # ABMIL baseline on frozen embeddings
  hidden: 256
  dropout: 0.25
  lr: 2.0e-4
  weight_decay: 1.0e-4
  epochs: 30
  max_tiles: 4096    # tiles sampled per slide at each training step
  threshold: 0.5
  folds: 5
  device: cpu        # small model: the CPU is fast enough and deterministic
  seeds: [0, 1, 2]   # the protocol runs once per seed, the gate reads the mean (E4: one seed
                     # is too noisy to decide on); the model kept is the first seed's
  workers: 3         # seeds trained in parallel processes, `threads` each
  threads: 1         # CPU threads for training: part of the result, a different count gives a
                     # different model (float summation order). 1 runs the same on any machine.
  normalize: none    # none | slide_mean: subtract each slide's mean tile (experiment E4)
  experiment: baseline-abmil
  report_dir: null   # null = data/reports/<backbone>/abmil; experiments write elsewhere
  register: true     # false for experiments: no model in the registry, no alias
  overwrite_splits: false

gate:                # promotion battery: initial proposals, to be agreed with the pathologists
  min_slides: 100    # below this a run only checks that the code works
  min_cv_auroc: 0.90
  min_loco_worst_auroc: 0.85
  min_test_auroc: 0.90
  max_ece: 0.10
  max_loco_ece: 0.10          # worst held-out centre, same limit as in CV
  min_loco_specificity: 0.80  # worst held-out centre: share of normal slides called normal
