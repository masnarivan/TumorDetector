defaults:
  - backbone: phikon
  - data: camelyon16
  - _self_

task: ???            # manifest | tile | embed | index | stream | splits | train
seed: 0

paths:
  out: data          # pipeline outputs (DVC-tracked), relative to the repo root

tiling:              # must match the backbone's native input (checked at embed time)
  tile_px: 224
  target_mpp: 0.5    # ~20x
  min_tissue: 0.5
  mask_downsample: 64
  mask_margin: 0.03

qc:                  # a slide below these thresholds is referred, never silently dropped
  min_tiles: 50
  min_tissue_mm2: 1.0

embed:
  batch_size: 64
  threads: 4
  dtype: float16
  device: auto       # auto | cuda | mps | cpu

vectordb:
  dsn: ${oc.env:TD_PG_DSN,postgresql://td:td_dev@localhost:5433/tumordetector}
  rebuild: false                 # drop and reload the collection's table (needed after a schema change)
  maintenance_work_mem: 4GB      # HNSW build: the graph should fit, and stay below the container's shm_size
  index_workers: 7

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: embedding-extraction

mil:                 # ABMIL baseline on frozen embeddings
  hidden: 256
  dropout: 0.25
  lr: 2.0e-4
  weight_decay: 1.0e-4
  epochs: 30
  max_tiles: 4096    # tiles sampled per slide at each training step
  threshold: 0.5
  folds: 5
  device: cpu        # small model: the CPU is fast enough and deterministic
  experiment: baseline-abmil
  overwrite_splits: false

gate:                # promotion battery: initial proposals, to be agreed with the pathologists
  min_slides: 100    # below this a run only checks that the code works
  min_cv_auroc: 0.90
  min_loco_worst_auroc: 0.85
  min_test_auroc: 0.90
  max_ece: 0.10
