defaults:
  - backbone: phikon
  - data: camelyon16
  - _self_

task: ???            # manifest | tile | embed | index
seed: 0

paths:
  out: data          # pipeline outputs (DVC-tracked), relative to the repo root

tiling:              # must match the backbone's native input (checked at embed time)
  tile_px: 224
  target_mpp: 0.5    # ~20x
  min_tissue: 0.5
  mask_downsample: 64
  mask_margin: 0.03

qc:                  # a slide below these thresholds is referred, never silently dropped
  min_tiles: 50
  min_tissue_mm2: 1.0

embed:
  batch_size: 64
  threads: 4
  dtype: float16
  device: auto       # auto | cuda | mps | cpu

vectordb:
  dsn: ${oc.env:TD_PG_DSN,postgresql://td:td_dev@localhost:5433/tumordetector}

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: embedding-extraction
