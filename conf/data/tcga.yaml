name: tcga
manifest: data/manifests/tcga.csv
# Nothing on this Mac: slides are fetched (`td task=fetch`, e.g. into Drive) and streamed (`td task=stream`).
# Outputs go in their own folder, so verify and index see one dataset per folder.
out: data/tcga
raw_dir: ${oc.env:TD_RAW_DIR,data/raw/tcga}
suffix: .svs                     # file name of a slide in raw_dir: <slide_id><suffix>
glass_quantile: 0.1              # scanned area mostly tissue: glass from the palest tenth (qc/tissue.py)
slides: null                     # null = every manifest slide found in raw_dir; or a list of ids
verify_md5: true
keep_slides: false               # task=stream only: keep each slide after embedding it
