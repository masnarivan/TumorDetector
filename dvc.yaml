# Reproducible pipeline: `dvc repro` reruns only the stages whose code, config or inputs changed.
# Each stage depends on exactly the code it runs and the config it reads (checked by tests/test_dvc.py).
#
#   stream  -> data/tiles, data/qc, data/embeddings/<backbone>   the whole manifest, slide by slide
#   index   -> Qdrant (regions + k-center prototypes per slide) + data/index/<backbone>.json
#   baseline-> data/reports/<backbone>/abmil
#   head-ln_metastasis -> data/reports/<backbone>/heads/ln_metastasis   CAMELYON16 + 17, its cohort file
#
# Not stages:
#   - manifest, splits and head cohorts (`td task=manifest`, `splits`, `cohort`): rebuilt on purpose,
#     versioned in git;
#   - `td task=tile` and `td task=embed`: development on the few slides on this machine. They need the
#     .tif, which `stream` deletes, so as stages they could not rebuild what they would overwrite.
#     They write into the same folders as `stream`, with the same rules: run `td task=verify` before
#     `dvc commit` if you used them.
#
# `stream` outputs are persistent: DVC never deletes them before a run, and the stream itself redoes
# only the slides whose file, tiling, QC thresholds or tile grid changed (rebuilding all of them means
# downloading ~700 GB again). A change to the tiling or embedding *code* reruns the stage, but the
# stream does not recompute slides that are current by those criteria: if the change should alter the
# outputs, delete them first.
vars:
  - backbone: phikon          # switch to h_optimus_0 once the weights are available

stages:
  stream:
    cmd: td task=stream backbone=${backbone}
    deps:
      - data/manifests/camelyon16.csv
      - conf/backbone/${backbone}.yaml
      - src/tumordetector/tasks/stream.py
      - src/tumordetector/tasks/tile.py
      - src/tumordetector/tasks/embed.py
      - src/tumordetector/tasks/common.py
      - src/tumordetector/io.py
      - src/tumordetector/data/camelyon16.py
      - src/tumordetector/data/camelyon17.py
      - src/tumordetector/data/camelyon_annotations.py
      - src/tumordetector/qc/tissue.py
      - src/tumordetector/wsi/tiling.py
      - src/tumordetector/embed
      - src/tumordetector/backbones
    params:
      - conf/config.yaml:
          - tiling
          - qc
          - embed.dtype
      - conf/data/camelyon16.yaml:
          - name
          - slides
    outs:
      - data/tiles:
          persist: true
      - data/qc:
          persist: true
      - data/embeddings/${backbone}:
          persist: true

  index:
    cmd: td task=index backbone=${backbone}
    deps:
      - data/embeddings/${backbone}
      - data/manifests/camelyon16.csv
      - src/tumordetector/tasks/index.py
      - src/tumordetector/tasks/common.py
      - src/tumordetector/io.py
      - src/tumordetector/embed/store.py
      - src/tumordetector/vectordb/qdrant.py
      - src/tumordetector/vectordb/reduce.py
    params:
      - conf/config.yaml:
          - index
      - conf/data/camelyon16.yaml:
          - slides
    outs:
      - data/index/${backbone}.json:
          cache: false

  baseline:
    cmd: td task=train backbone=${backbone}
    deps:
      - data/embeddings/${backbone}
      - data/manifests/camelyon16.csv
      - data/manifests/camelyon16_splits.csv
      - src/tumordetector/tasks/train.py
      - src/tumordetector/tasks/common.py
      - src/tumordetector/io.py
      - src/tumordetector/embed/store.py
      - src/tumordetector/mil
    params:
      - conf/config.yaml:
          - seed
          - gate
          - mil.hidden
          - mil.dropout
          - mil.lr
          - mil.weight_decay
          - mil.epochs
          - mil.max_tiles
          - mil.threshold
          - mil.folds
          - mil.device
          - mil.seeds
          - mil.threads
          - mil.normalize
      - conf/data/camelyon16.yaml:
          - name
    outs:
      - data/reports/${backbone}/abmil/model.pt
      - data/reports/${backbone}/abmil/predictions.csv
      - data/reports/${backbone}/abmil/attention.csv
      - data/reports/${backbone}/abmil/report.md:
          cache: false        # small and worth reading in a diff: versioned in git
    metrics:
      - data/reports/${backbone}/abmil/metrics.json:
          cache: false

  head-ln_metastasis:
    # CAMELYON17 embeddings come from `td task=stream data=camelyon17` (not a stage yet); the locked
    # external slides (LPON) are in the folder but never read by this task.
    cmd: td task=train_head backbone=${backbone} head=ln_metastasis
    deps:
      - data/embeddings/${backbone}
      - data/camelyon17/embeddings/${backbone}
      - data/manifests/camelyon16.csv
      - data/manifests/camelyon17.csv
      - data/manifests/heads/ln_metastasis.csv
      - src/tumordetector/tasks/train_head.py
      - src/tumordetector/config.py
      - src/tumordetector/io.py
      - src/tumordetector/embed/store.py
      - src/tumordetector/heads
      - src/tumordetector/mil
    params:
      - conf/config.yaml:
          - mil.hidden
          - mil.dropout
          - mil.lr
          - mil.weight_decay
          - mil.epochs
          - mil.max_tiles
          - mil.threshold
          - mil.folds
          - mil.device
          - mil.seeds
          - mil.threads
          - mil.normalize
      - conf/head/ln_metastasis.yaml:
          - id
          - version
          - module
          - task
          - sites
          - datasets
          - labels
          - domain
          - roles
          - recipe
          - calibration
          - conformal
          - gate
    outs:
      - data/reports/${backbone}/heads/ln_metastasis/model.pt
      - data/reports/${backbone}/heads/ln_metastasis/predictions.csv
      - data/reports/${backbone}/heads/ln_metastasis/attention.csv
      - data/reports/${backbone}/heads/ln_metastasis/excluded.csv:
          cache: false
      - data/reports/${backbone}/heads/ln_metastasis/calibration.json:
          cache: false        # the temperature that goes with model.pt: small, read in a diff
      - data/reports/${backbone}/heads/ln_metastasis/conformal.json:
          cache: false        # the quantiles of the prediction sets (E10), same model and folds
      - data/reports/${backbone}/heads/ln_metastasis/report.md:
          cache: false
    metrics:
      - data/reports/${backbone}/heads/ln_metastasis/metrics.json:
          cache: false
